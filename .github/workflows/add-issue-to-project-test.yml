name: "Test: Add issue to project"

on:
  issues:
    types:
      - opened
      - transferred

jobs:
  call-reusable-flow:
    permissions:
      id-token: write  # mint GitHub OIDC token for Vault JWT auth (required by the called reusable workflow)
    uses: camunda/automation-platform-github-actions/.github/workflows/add-issue-to-project.yml@main
    secrets: inherit
    with:
      project: '49'
